
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Furnitur 3D + AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f3;
      color: #222;
    }

    header {
      background: white;
      padding: 22px 16px;
      border-bottom: 1px solid #e8e8e5;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 24px 16px 40px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 20px #0000000b;
    }

    h1 { font-size: 25px; margin: 0 0 8px; }
    h2 { font-size: 23px; margin: 18px 0 8px; }
    p { line-height: 1.5; color: #555; }

    model-viewer {
      display: block;
      width: 100%;
      height: 430px;
      background: #f7f7f7;
      border-radius: 12px;
    }

    .price { font-size: 18px; font-weight: bold; }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button, a.button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    button { background: #222; color: white; }
    a.button { background: #e9e9e6; color: #222; }

    .hint { font-size: 13px; color: #777; }

    @media (max-width: 600px) {
      model-viewer { height: 340px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>

<body>
<header>
  <h1>Furnitur 3D + AR</h1>
  <p>Lihat produk dalam 3D dan coba tempatkan di ruangan Anda jika perangkat mendukung AR.</p>
</header>

<main>
  <div id="productArea"></div>
</main>

<script>
  // DAFTAR PRODUK
  // Tambahkan produk baru di sini jika file GLB sudah diunggah.

  const products = [
    {
      id: "meja-makan",
      name: "Meja Makan",
      price: "Harga belum ditentukan",
      model: "./models/modelsidetable.glb",
      buyUrl: "https://shopee.co.id/",
      description: "Putar dan perbesar model meja untuk melihatnya dari berbagai sisi."
    }

    // Contoh produk berikutnya:
    // {
    //   id: "sofa",
    //   name: "Sofa",
    //   price: "Rp1.500.000",
    //   model: "./models/sofa.glb",
    //   buyUrl: "MASUKKAN_LINK_PRODUK",
    //   description: "Deskripsi sofa."
    // }
  ];

  // Pilih produk berdasarkan link ?product=ID
  const params = new URLSearchParams(window.location.search);
  const productId = params.get("product");

  const product =
    products.find(item => item.id === productId) || products[0];

  document.title = product.name + " | Furnitur 3D + AR";

  const area = document.getElementById("productArea");
  const card = document.createElement("div");
  card.className = "card";

  const viewer = document.createElement("model-viewer");
  viewer.setAttribute("src", product.model);
  viewer.setAttribute("alt", product.name);
  viewer.setAttribute("camera-controls", "");
  viewer.setAttribute("auto-rotate", "");
  viewer.setAttribute("shadow-intensity", "1");
  viewer.setAttribute("exposure", "1");
  viewer.setAttribute("ar", "");
  viewer.setAttribute("ar-modes", "scene-viewer quick-look");
  viewer.setAttribute("ar-placement", "floor");
  viewer.setAttribute("ar-scale", "auto");
  viewer.setAttribute("loading", "eager");

  const title = document.createElement("h2");
  title.textContent = product.name;

  const price = document.createElement("p");
  price.className = "price";
  price.textContent = product.price;

  const description = document.createElement("p");
  description.textContent = product.description;

  const buttons = document.createElement("div");
  buttons.className = "buttons";

  const arButton = document.createElement("button");
  arButton.textContent = "Lihat di Ruangan Saya (AR)";

  arButton.addEventListener("click", async () => {
    if (!viewer.loaded) {
      alert("Model sedang dimuat. Tunggu sebentar lalu coba lagi.");
      return;
    }

    if (!viewer.canActivateAR) {
      alert("AR tidak tersedia di perangkat ini. Anda tetap bisa melihat model 3D.");
      return;
    }

    try {
      await viewer.activateAR();
    } catch (error) {
      alert("AR tidak dapat dibuka. Tampilan 3D tetap tersedia.");
    }
  });

  const buyButton = document.createElement("a");
  buyButton.className = "button";
  buyButton.href = product.buyUrl;
  buyButton.target = "_blank";
  buyButton.rel = "noopener";
  buyButton.textContent = "Beli Produk";

  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent =
    "AR hanya berfungsi pada perangkat yang kompatibel.";

  buttons.append(arButton, buyButton);
  card.append(viewer, title, price, description, buttons, hint);
  area.appendChild(card);
</script>
</body>
</html>
